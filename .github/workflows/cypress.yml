name: Browser smoke

on:
   pull_request:
      branches: [main]
   push:
      branches: [main]

jobs:
   browser-smoke:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version: 24
              cache: npm
         - run: npm ci
         - run: npm ci --prefix frontend
         - name: Run browser smoke against stubbed services
           uses: cypress-io/github-action@v6
           with:
              install: false
              start: npm run dev --prefix frontend -- --host 0.0.0.0
              wait-on: http://localhost:5173/signin
              spec: cypress/e2e/smoke.cy.js
           env:
              VITE_SUPABASE_URL: https://example.supabase.co
              VITE_SUPABASE_ANON_KEY: public-test-key
