# ci-testing.yml
# GitHub Actions workflow for continuous integration testing of the Supabase Next.js template

# Name of the CI workflow shown in GitHub Actions tab
name: CI Testing

# Triggers: run this workflow on every push to main branch
# and on pull requests so Copilot can review them
on:
   push:
      branches: [main]
   pull_request:
      branches: [main, chore/docker-local-pilot]

jobs:
   rls:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version: 24
         - run: npm run test:rls

   build:
      runs-on: ubuntu-latest

      steps:
         # Step 1: Check out the repository code onto the runner
         - uses: actions/checkout@v4

         # Step 2: Set up Node.js version matching local development environment
         - uses: actions/setup-node@v3
           with:
              node-version: 24

         # Step 3: Clean install root dependencies
         - run: npm ci

         # Step 4: Clean install frontend dependencies
         - run: npm ci --prefix frontend

         # Step 5: Clean install backend dependencies
         - run: npm ci --prefix backend

         # Step 6: Run ESLint and Prettier checks on frontend and backend
         - run: npm run lint
         - run: npm run format:check

         # Step 7: Run all frontend and backend Jest tests
         - run: npm test
         - name: Build frontend
           run: npm run build --prefix frontend
           env:
              VITE_SUPABASE_URL: https://example.supabase.co
              VITE_SUPABASE_ANON_KEY: public-test-key

   container-smoke:
      runs-on: ubuntu-latest
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v4
         - name: Build isolated preview
           run: docker compose build
           env:
              UMAMI_REVISION: ${{ github.sha }}
         - name: Start isolated preview
           run: docker compose up --detach --wait --wait-timeout 60
           env:
              UMAMI_REVISION: ${{ github.sha }}
         - name: Verify HTTP and worker fixtures
           run: node tests/container-smoke.mjs
           env:
              UMAMI_REVISION: ${{ github.sha }}
         - name: Verify API ownership against actual containers
           run: node tests/auth-container-smoke.mjs
           env:
              UMAMI_REVISION: ${{ github.sha }}
         - name: Container logs on failure
           if: failure()
           run: docker compose logs --no-color --tail=100
           env:
              UMAMI_REVISION: ${{ github.sha }}
         - name: Stop preview
           if: always()
           run: docker compose down
           env:
              UMAMI_REVISION: ${{ github.sha }}
