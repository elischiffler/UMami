name: CI Testing

on:
   push:
      branches: [main]
   pull_request:
      branches: [main, chore/docker-local-pilot]

permissions:
   contents: read

jobs:
   checks:
      runs-on: ubuntu-latest
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version: 24
              cache: npm
              cache-dependency-path: |
                 package-lock.json
                 backend/package-lock.json
                 frontend/package-lock.json
         - run: npm ci
         - run: npm ci --prefix backend
         - run: npm ci --prefix frontend
         - run: npm run format:check
         - run: npm run lint
         - run: npm test
         - run: npm --prefix frontend run build
           env:
              VITE_API_BASE_URL: http://127.0.0.1:3003
              VITE_SUPABASE_URL: http://127.0.0.1:8083/supabase
              VITE_SUPABASE_ANON_KEY: umami-local-fixture-anon

   container-smoke:
      runs-on: ubuntu-latest
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@v4
         - name: Build isolated preview
           run: docker compose build
           env:
              UMAMI_REVISION: ${{ github.sha }}
         - name: Start isolated preview
           run: docker compose up --detach --wait --wait-timeout 60
           env:
              UMAMI_REVISION: ${{ github.sha }}
         - name: Verify HTTP and worker fixtures
           run: node tests/container-smoke.mjs
           env:
              UMAMI_REVISION: ${{ github.sha }}
         - name: Verify API ownership against actual containers
           run: node tests/auth-container-smoke.mjs
           env:
              UMAMI_REVISION: ${{ github.sha }}
         - name: Container logs on failure
           if: failure()
           run: docker compose logs --no-color --tail=100
           env:
              UMAMI_REVISION: ${{ github.sha }}
         - name: Stop preview
           if: always()
           run: docker compose down
           env:
              UMAMI_REVISION: ${{ github.sha }}
