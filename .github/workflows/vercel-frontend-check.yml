name: Validate Vercel Frontend

on:
   pull_request:
      paths:
         - "frontend/**"
         - ".github/workflows/vercel-frontend-check.yml"
   push:
      branches: [main]
      paths:
         - "frontend/**"
         - ".github/workflows/vercel-frontend-check.yml"

permissions:
   contents: read

jobs:
   frontend:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version: 24
              cache: npm
              cache-dependency-path: frontend/package-lock.json
         - run: npm ci --prefix frontend
         - run: npm run lint --prefix frontend
         - run: npm test --prefix frontend -- --watchAll=false --runInBand
         - run: npm run build --prefix frontend
           env:
              VITE_SUPABASE_URL: https://preview-disabled.invalid
              VITE_SUPABASE_ANON_KEY: sb_publishable_preview_disabled
