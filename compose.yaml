name: umami-local

x-runtime: &runtime
   read_only: true
   cap_drop: [ALL]
   security_opt: [no-new-privileges:true]
   pids_limit: 128
   restart: unless-stopped
   stop_grace_period: 10s
   logging:
      driver: json-file
      options:
         max-size: "10m"
         max-file: "3"

services:
   fixture-supabase:
      <<: *runtime
      networks: [isolated]
      build:
         context: ./fixtures
         args:
            VCS_REF: ${UMAMI_REVISION:?Set UMAMI_REVISION to the current Git commit SHA}
      image: umami-fixture:${UMAMI_REVISION:?Set UMAMI_REVISION to the current Git commit SHA}
      mem_limit: 128m
      cpus: 0.25
      healthcheck:
         test:
            [
               CMD,
               node,
               -e,
               "fetch('http://127.0.0.1:54321/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
            ]
         interval: 10s
         timeout: 3s
         start_period: 10s
         retries: 3

   api:
      <<: *runtime
      networks: [preview, isolated]
      build:
         context: ./backend
         target: api
         args:
            VCS_REF: ${UMAMI_REVISION:?Set UMAMI_REVISION to the current Git commit SHA}
      image: umami-api:${UMAMI_REVISION:?Set UMAMI_REVISION to the current Git commit SHA}
      environment:
         PORT: "3003"
         SUPABASE_URL: http://fixture-supabase:54321
         SUPABASE_SECRET_KEY: umami-local-fixture-key
         CORS_ORIGINS: http://127.0.0.1:${UMAMI_FRONTEND_PORT:-8083},http://localhost:${UMAMI_FRONTEND_PORT:-8083}
      ports:
         - 127.0.0.1:${UMAMI_API_PORT:-3003}:3003
      tmpfs:
         - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      mem_limit: 256m
      cpus: 0.5
      depends_on:
         fixture-supabase:
            condition: service_healthy
      healthcheck:
         test:
            [
               CMD,
               node,
               -e,
               "fetch('http://127.0.0.1:3003/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
            ]
         interval: 10s
         timeout: 3s
         start_period: 10s
         retries: 3

   worker:
      <<: *runtime
      networks: [isolated]
      build:
         context: ./backend
         target: worker
         args:
            VCS_REF: ${UMAMI_REVISION:?Set UMAMI_REVISION to the current Git commit SHA}
      image: umami-worker:${UMAMI_REVISION:?Set UMAMI_REVISION to the current Git commit SHA}
      environment:
         SUPABASE_URL: http://fixture-supabase:54321
         SUPABASE_SECRET_KEY: umami-local-fixture-key
         DINE_ON_CAMPUS_ORIGIN: http://fixture-supabase:54321
         UMAMI_SCRAPER_MODE: fixture
         WORKER_PORT: "3004"
         TZ: America/Los_Angeles
      init: true
      tmpfs:
         - /tmp:rw,nosuid,size=256m,mode=1777
      shm_size: 256m
      mem_limit: 1g
      cpus: 1.5
      depends_on:
         fixture-supabase:
            condition: service_healthy
      healthcheck:
         test:
            [
               CMD,
               node,
               -e,
               "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
            ]
         interval: 10s
         timeout: 3s
         start_period: 20s
         retries: 3

   frontend:
      <<: *runtime
      networks: [preview, isolated]
      build:
         context: ./frontend
         args:
            VCS_REF: ${UMAMI_REVISION:?Set UMAMI_REVISION to the current Git commit SHA}
            VITE_API_BASE_URL: http://127.0.0.1:${UMAMI_API_PORT:-3003}
            VITE_SUPABASE_URL: http://127.0.0.1:${UMAMI_FRONTEND_PORT:-8083}/supabase
            VITE_SUPABASE_ANON_KEY: umami-local-fixture-anon
      image: umami-frontend:${UMAMI_REVISION:?Set UMAMI_REVISION to the current Git commit SHA}
      ports:
         - 127.0.0.1:${UMAMI_FRONTEND_PORT:-8083}:8080
      tmpfs:
         - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      mem_limit: 128m
      cpus: 0.5
      depends_on:
         fixture-supabase:
            condition: service_healthy
         api:
            condition: service_healthy

networks:
   preview:
   isolated:
      internal: true
