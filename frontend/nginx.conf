worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header_inherit merge;
        location = /healthz { default_type text/plain; add_header Cache-Control no-store; return 200 "ok\n"; }
        location ^~ /supabase/ {
            proxy_pass http://fixture-supabase:54321/;
            proxy_set_header Host fixture-supabase;
        }
        location ^~ /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
        location ~* \.[^/]+$ { add_header Cache-Control "public, max-age=300, must-revalidate"; try_files $uri =404; }
        location / { add_header Cache-Control no-cache; try_files $uri $uri/ /index.html; }
    }
}
